name: "Autonomous SRE Multi-Agent Incident Resolver"

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve-incident:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest requests

      - name: Acknowledge Issue on GitHub
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "🤖 **Azure AI Foundry SRE Multi-Agent System** detected this issue!\n\nInitiating autonomous diagnosis:\n1. 🧐 **Critic Agent** (`grok-4-20-reasoning`): Deep reasoning & safety constraints.\n2. 🛠️ **Fix Planner Agent** (`gpt-5-mini`): Surgical diff patch generation.\n3. 🧪 **Sandbox Validator**: Isolated pytest regression testing."
            })

      - name: Run Multi-Agent Resolution & Pytest Validation
        id: agent_fix
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT || 'https://agentathon-2026-resource.openai.azure.com/' }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python scripts/agent_autofix.py

      - name: Create Pull Request with Verified Fix
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "azure-foundry-sre-agent[bot]"
          git config user.email "azure-foundry-sre-agent@users.noreply.github.com"
          BRANCH_NAME="fix/issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH_NAME"
          git add .
          git commit -m "fix: resolve issue #${{ github.event.issue.number }}"
          git push origin "$BRANCH_NAME" --force
          gh pr create --title "fix: Resolve #${{ github.event.issue.number }} - ${{ github.event.issue.title }}" \
                       --body-file resolution_report.md \
                       --base main \
                       --head "$BRANCH_NAME"

      - name: Update Issue with Success Status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "✅ **Autonomous Fix Verified!**\n\n- All `pytest` tests passed with zero regressions.\n- A verified Pull Request has been opened automatically."
            })

      - name: Notify on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "⚠️ **Autonomous Fix Blocked by Safety Gate.**\n\nThe candidate fix did not pass the sandbox pytest suite or was flagged by the Critic Agent. Human review is requested."
            })

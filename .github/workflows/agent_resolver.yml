name: "Autonomous SRE Multi-Agent Incident Resolver"

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to resolve'
        required: true
        default: '1'
      issue_title:
        description: 'Issue title'
        required: true
        default: 'INC-002: Double discount deduction applied during checkout calculation'
      issue_body:
        description: 'Issue body'
        required: false
        default: 'Discount is deducted twice from subtotal in app/services/payment_service.py'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve-incident:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest requests

      - name: Acknowledge Issue on GitHub
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "🤖 **Azure AI Foundry SRE Multi-Agent System** detected this issue!\n\nInitiating autonomous diagnosis:\n1. 🧐 **Critic Agent** (`grok-4-20-reasoning`): Deep reasoning & safety constraints.\n2. 🛠️ **Fix Planner Agent** (`gpt-5-mini`): Surgical diff patch generation.\n3. 🧪 **Sandbox Validator**: Isolated pytest regression testing."
            })

      - name: Run Multi-Agent Resolution & Pytest Validation
        id: agent_fix
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT || 'https://agentathon-2026-resource.openai.azure.com/' }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number || '1' }}
          ISSUE_TITLE: ${{ github.event.issue.title || inputs.issue_title || 'INC-002: Double discount deduction' }}
          ISSUE_BODY: ${{ github.event.issue.body || inputs.issue_body || 'Discount is deducted twice' }}
        run: |
          python scripts/agent_autofix.py

      - name: Create Pull Request with Verified Fix
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number || inputs.issue_number || '1' }}
          ISSUE_TIT: ${{ github.event.issue.title || inputs.issue_title || 'Incident Fix' }}
        run: |
          git config user.name "azure-foundry-sre-agent[bot]"
          git config user.email "azure-foundry-sre-agent@users.noreply.github.com"
          BRANCH_NAME="fix/issue-${ISSUE_NUM}"
          git checkout -B "$BRANCH_NAME"
          git add .
          git commit -m "fix: resolve issue #${ISSUE_NUM}"
          git push origin "$BRANCH_NAME" --force
          gh pr create --title "fix: Resolve #${ISSUE_NUM} - ${ISSUE_TIT}" \
                       --body-file resolution_report.md \
                       --base main \
                       --head "$BRANCH_NAME" || gh pr edit "$BRANCH_NAME" --body-file resolution_report.md

      - name: Update Issue with Success Status
        if: success() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "✅ **Autonomous Fix Verified!**\n\n- Targeted service `pytest` suite passed with zero regressions.\n- A verified Pull Request has been opened automatically."
            })

      - name: Notify on Failure
        if: failure() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "⚠️ **Autonomous Fix Blocked by Safety Gate.**\n\nThe candidate fix did not pass the sandbox pytest suite or was flagged by the Critic Agent. Human review is requested."
            })
